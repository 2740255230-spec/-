app:
  description: 你好，我是你的生活小助手。我擅长帮你解决日常生活中的各种小麻烦——无论是家电异常、管道堵塞、网络故障，还是室内返潮、衣物清洁、睡眠困扰，只要你说清楚问题，我就能为你整理出清晰、可执行的检验步骤。我会用最简单的话告诉你：问题出在哪、可能是什么原因、具体该怎么处理，还会在必要时生成示意图，让你一看就懂。如果情况超出自行处理范围，我也会建议你何时该求助专业人士。把琐事交给我，你把时间留给生活。随时可以开始提问。
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: 生活小助手Agent
  use_icon_as_answer_icon: false

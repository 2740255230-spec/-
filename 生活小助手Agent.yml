    - data:
        code: "\nimport re\n\ndef main(query: str) -> dict:  # 去掉标点和空格，把“冰箱，不制冷？”变成“冰箱不制冷”。这样更容易匹配关键词。\n\
          \    raw_text = query or \"\"\n    text = raw_text.strip()\n    text_lower\
          \ = text.lower()\n\n    # 去掉空格和常见标点，方便判断\n    text_compact = re.sub(r\"\
          [\\s，。！？、,.!?；;：:（）()【】\\[\\]\\\"'“”‘’]\", \"\", text_lower)\n\n    # 统一返回结构：不改变你的输出变量\n\
          \    def make_result(matched=False, need_rag=False, need_clarify=False,\n\
          \                    problem=\"\", cause=\"\", method=\"\", rag_query=\"\
          \", answer_text=\"\"):\n        return {\n            \"matched\": matched,\n\
          \            \"need_rag\": need_rag,\n            \"need_clarify\": need_clarify,\n\
          \            \"problem\": problem,\n            \"cause\": cause,\n    \
          \        \"method\": method,\n            \"rag_query\": rag_query,\n  \
          \          \"answer_text\": answer_text\n        }\n\n    # 规则命中后的标准回复\n\
          \    def build_answer(problem: str, cause: str, method: str) -> str:\n \
          \       return f\"\"\"【问题判断】\n{problem}\n\n【可能原因】\n{cause}\n\n【处理方法】\n{method}\n\
          \n【何时进一步求助】\n如果按照上述步骤处理后仍无效，或涉及人身安全、用电风险、燃气风险、严重身体不适等情况，请尽快联系专业人员或相关机构。\"\
          \"\"\n\n    # 生活问题规则库 里面存了问题、关键词、原因、方法。常见问题时，不用查知识库，直接命中更稳定。\n    bug_db\
          \ = [\n        {\n            \"problem\": \"Wi-Fi不稳定/网络断连\",\n        \
          \    \"keywords\": [\"wifi\", \"wi-fi\", \"网络断\", \"断网\", \"连不上网\", \"信号差\"\
          , \"网速慢\", \"路由器\"],\n            \"cause\": \"可能是路由器长时间未重启、宽带波动、设备距离路由器太远，或同时联网设备过多。\"\
          ,\n            \"method\": \"1. 先重启路由器和光猫；2. 靠近路由器重新测试；3. 关闭占网设备或后台下载；4.\
          \ 检查宽带是否欠费或运营商是否异常；5. 仍无效时联系网络运营商。\"\n        },\n        {\n          \
          \  \"problem\": \"手机卡顿/发热严重\",\n            \"keywords\": [\"手机卡\", \"手机发热\"\
          , \"发热\", \"很烫\", \"卡顿\", \"反应慢\", \"掉帧\", \"耗电快\"],\n            \"cause\"\
          : \"可能是后台程序过多、存储空间不足、长时间高负载运行、系统缓存过多或电池老化。\",\n            \"method\": \"\
          1. 关闭后台应用；2. 清理存储空间；3. 重启手机；4. 关闭高耗电功能；5. 若持续异常可检查系统更新或售后检测电池。\"\n     \
          \   },\n        {\n            \"problem\": \"冰箱不制冷/制冷变差\",\n          \
          \  \"keywords\": [\"冰箱不冷\", \"冰箱不制冷\", \"不制冷\", \"冷藏不冷\", \"冷冻不冷\", \"冰箱坏了\"\
          ],\n            \"cause\": \"可能是温控档位异常、开门过于频繁、散热空间不足、密封条老化，或压缩机、制冷系统异常。\"\
